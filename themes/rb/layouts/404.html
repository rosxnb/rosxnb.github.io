{{ define "main" }}
<div class="layout layout--full">
  <main class="main-content" style="text-align: center; padding-top: 5rem;">
    <p style="font-size: 6rem; font-weight: 700; color: var(--border); line-height: 1;">404</p>
    <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">Page not found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ "/" | relURL }}" style="color: var(--accent);">← Back to home</a>
  </main>
</div>
{{ end }}
