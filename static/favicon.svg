<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="13" fill="none" stroke="#2d2d2d" stroke-width="1"/>

  <!-- "r" in monospace -->
  <text
    x="10"
    y="46"
    font-family="'SF Mono', 'Courier New', monospace"
    font-size="38"
    font-weight="700"
    fill="#f5f5f7">r</text>

  <!-- Blue accent dot -->
  <circle cx="53" cy="46" r="6" fill="#0066cc"/>
</svg>
