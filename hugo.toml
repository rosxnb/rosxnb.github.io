baseURL = "https://rosxnb.github.io/"
languageCode = "en-us"
title = "Roshan Bharati"
theme = "rb"

ignoreLogs = [
    'warning-home-page-is-leaf-bundle'
]

[params]
    # description = "Low Level Performance Oriented System Engineer | AI Researcher"
    description = "C++ Developer | AI Researcher"
    author = "Roshan Bharati"
    username = "rosxnb"
    github = "https://github.com/rosxnb"
    linkedin = "https://linkedin.com/in/rosxnb"
    email = "rosxnb@gmail.com"

[params.math]
    enable = true

[params.mermaid]
    enable = true

[params.goatcounter]
  # Get code from https://goatcounter.com
  # Example: if URL is "mysite.goatcounter.com", code is "mysite"
  code = ""

[taxonomies]
    tag = "tags"
    category = "categories"
    series = "series"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true   # Allow raw HTML in markdown (needed for KaTeX, etc.)
        # Hand math to KaTeX untouched. Without this, Goldmark eats backslash
        # escapes (\; \, \!) and turns `)_{...}` into <em> inside formulas.
        # Delimiters must match those in themes/rb/layouts/_partials/head/math.html
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block  = [['$$', '$$'], ['\[', '\]']]
                inline = [['$', '$'], ['\(', '\)']]
    [markup.highlight]
        noClasses = false   # Use CSS classes (not inline styles) for Chroma
        lineNos = false
        codeFences = true
        guessSyntax = true
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false

[menu]
    [[menu.main]]
        name = "Notes"
        url = "/notes/"
        weight = 1
    [[menu.main]]
        name = "Explore"
        url = "/explore/"
        weight = 2
    [[menu.main]]
        name = "Projects"
        url = "/projects/"
        weight = 3
    [[menu.main]]
        name = "Research"
        url = "/research/"
        weight = 4
